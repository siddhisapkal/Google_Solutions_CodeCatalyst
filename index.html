<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>AI Voice Detection</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f3f4f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        h1 {
            color: #1f2937;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
            min-width: 300px;
        }

        button {
            background-color: #4f46e5;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #3730a3;
        }

        .prediction {
            font-size: 18px;
            margin-top: 20px;
            font-weight: 600;
            color: #1e40af;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>AI Voice Detection</h1>
        <button type="button" onclick="init()">🎙 Start Listening</button>
        <div class="prediction" id="label-container">Waiting for input...</div>
    </div>

    <!-- TensorFlow and Speech Commands -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script
        src="https://cdn.jsdelivr.net/npm/@tensorflow-models/speech-commands@0.4.0/dist/speech-commands.min.js"></script>

    <script type="text/javascript">
        const URL = "https://teachablemachine.withgoogle.com/models/yr8Vu-8ln/";

        async function createModel() {
            const checkpointURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            const recognizer = speechCommands.create(
                "BROWSER_FFT",
                undefined,
                checkpointURL,
                metadataURL
            );

            await recognizer.ensureModelLoaded();
            return recognizer;
        }

        async function init() {
            const recognizer = await createModel();
            const classLabels = recognizer.wordLabels();
            const labelContainer = document.getElementById("label-container");

            recognizer.listen(result => {
                const scores = result.scores;
                let maxScore = 0;
                let bestLabel = "Listening...";

                for (let i = 0; i < classLabels.length; i++) {
                    if (scores[i] > maxScore) {
                        maxScore = scores[i];
                        bestLabel = `${classLabels[i]}: ${(scores[i] * 100).toFixed(1)}%`;
                    }
                }

                labelContainer.innerText = bestLabel;
            }, {
                includeSpectrogram: true,
                probabilityThreshold: 0.75,
                invokeCallbackOnNoiseAndUnknown: true,
                overlapFactor: 0.5
            });
        }
    </script>
</body>

</html>
